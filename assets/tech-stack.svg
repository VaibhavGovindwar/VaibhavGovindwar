<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="100" viewBox="0 0 1800 100" role="img" aria-label="Scrolling technology stack: Python, TensorFlow, PyTorch, OpenCV, NumPy, Pandas, Scikit-learn, Matplotlib, Seaborn, Power BI, Flask, Streamlit, Git and GitHub">
  <defs>
    <style>
      .track { animation: scroll 28s linear infinite; }
      .name { font: 600 20px Arial, sans-serif; fill: #d1d5db; }
      .pill { fill: #172033; stroke: #334155; stroke-width: 1.5; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
      @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
    </style>
  </defs>
  <rect width="1800" height="100" rx="14" fill="#0b1220"/>
  <g class="track">
